services:
  node1:
    build:
      context: ./backend
    container_name: distributed-node-1
    environment:
      NODE_ID: 1
      GRPC_PORT: 50051
      REST_PORT: 8001
      NODE_PEERS: node1:50051,node2:50052,node3:50053
    ports:
      - "50051:50051"
      - "8001:8001"
    restart: unless-stopped

  node2:
    build:
      context: ./backend
    container_name: distributed-node-2
    environment:
      NODE_ID: 2
      GRPC_PORT: 50052
      REST_PORT: 8002
      NODE_PEERS: node1:50051,node2:50052,node3:50053
    ports:
      - "50052:50052"
      - "8002:8002"
    restart: unless-stopped

  node3:
    build:
      context: ./backend
    container_name: distributed-node-3
    environment:
      NODE_ID: 3
      GRPC_PORT: 50053
      REST_PORT: 8003
      NODE_PEERS: node1:50051,node2:50052,node3:50053
    ports:
      - "50053:50053"
      - "8003:8003"
    restart: unless-stopped

  bridge:
    build:
      context: ./backend
    container_name: distributed-bridge
    command: ["java", "-Dloader.main=com.distributed.bridge.BridgeApp", "-jar", "/app/app.jar"]
    environment:
      BRIDGE_NODE_HOSTS: node1,node2,node3
      BRIDGE_NODE_GRPC_PORTS: 50051,50052,50053
      BRIDGE_NODE_REST_PORTS: 8001,8002,8003
    depends_on:
      - node1
      - node2
      - node3
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: distributed-frontend
    depends_on:
      - bridge
    ports:
      - "5173:80"
    restart: unless-stopped
